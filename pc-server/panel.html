<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC 遥控器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#0d1526;
  --sub:#6a758b;
  --faint:#98a2b6;
  --line:rgba(16,24,40,.075);
  --fill:#f1f4fa;
  --accent:#3b6df6;
  --accent-deep:#2f5be0;
  --ok:#10b981;
  --danger:#e0484d;
  --r-lg:16px;
  --r-md:11px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 14px 30px -20px rgba(16,24,40,.35);
}
html,body{height:100%}
body{
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(760px 340px at 6% -12%,#e6ecff 0%,rgba(230,236,255,0) 62%),
    radial-gradient(620px 300px at 104% -6%,#f0e9ff 0%,rgba(240,233,255,0) 58%),
    linear-gradient(180deg,#f8fafe 0%,#f1f4fa 58%,#eaedf5 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  user-select:none;
  overflow:auto;
  scrollbar-width:thin;
}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:rgba(16,24,40,.16);border:3px solid transparent;background-clip:content-box;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(16,24,40,.28);background-clip:content-box}

.app{
  max-width:520px;margin:0 auto;
  padding:14px 16px 16px;
  display:flex;flex-direction:column;gap:11px;
}

/* ---------------- 卡片 ---------------- */
.card{
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:14px 16px;
  animation:rise .42s cubic-bezier(.2,.75,.3,1) backwards;
}
.card:nth-of-type(1){animation-delay:.02s}
.card:nth-of-type(2){animation-delay:.07s}
.card:nth-of-type(3){animation-delay:.12s}
.card:nth-of-type(4){animation-delay:.17s}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .card{animation:none}
  .dot::after{animation:none}
}

/* ---------------- 状态 ---------------- */
.hero{display:flex;align-items:center;gap:13px;padding:16px;
  background:linear-gradient(135deg,#ffffff 0%,#fbfcff 55%,#f5f8ff 100%)}
.dot{
  position:relative;flex:0 0 auto;width:11px;height:11px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.14);
}
.dot::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:2px solid rgba(16,185,129,.45);animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
.dot.off{background:#b6becc;box-shadow:0 0 0 4px rgba(150,160,180,.14)}
.dot.off::after{border-color:rgba(150,160,180,.4);animation:none}

.heroText{min-width:0;flex:1}
.heroTitle{font-size:16.5px;font-weight:650;letter-spacing:.01em;line-height:1.25}
.heroSub{margin-top:3px;font-size:12.5px;color:var(--sub);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------------- 通用小元素 ---------------- */
.tag{
  display:inline-flex;align-items:center;height:20px;padding:0 8px;margin-left:8px;
  font-size:11.5px;font-weight:600;color:var(--accent-deep);
  background:rgba(59,109,246,.1);border-radius:999px;vertical-align:middle;
}
.cardHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.cardTitle{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em}
.hint{font-size:11.5px;color:var(--faint);margin-top:3px}

/* ---------------- 连接信息 ---------------- */
.field{
  display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;
  background:var(--fill);border:1px solid rgba(16,24,40,.05);border-radius:var(--r-md);
}
.field svg{flex:0 0 auto;color:var(--faint)}
.mono{
  font-family:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
  font-size:13.5px;font-weight:500;letter-spacing:.01em;color:#26314a;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pinBlock{margin-top:13px;padding:9px 13px 10px;border-radius:var(--r-md);
  background:linear-gradient(135deg,rgba(59,109,246,.07),rgba(123,92,240,.05));
  border:1px solid rgba(59,109,246,.1);display:flex;align-items:center;justify-content:space-between}
.pinLabel{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.04em}
.pin{
  font-family:"Cascadia Mono","Consolas",ui-monospace,monospace;
  font-size:25px;font-weight:600;line-height:1;letter-spacing:.16em;
  color:var(--accent-deep);font-feature-settings:"tnum" 1;
}

.mini{
  height:28px;padding:0 11px;border-radius:8px;cursor:pointer;
  font:inherit;font-size:12px;font-weight:600;color:var(--sub);
  background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 1px rgba(16,24,40,.03);
  transition:.16s ease;display:inline-flex;align-items:center;gap:5px;
}
.mini:hover{color:var(--ink);border-color:rgba(16,24,40,.14);background:#fbfcfe;
  transform:translateY(-1px);box-shadow:0 3px 8px -4px rgba(16,24,40,.3)}
.mini:active{transform:translateY(0) scale(.97)}
.mini.ic{width:28px;padding:0;justify-content:center}

/* ---------------- 音量 / 亮度 ---------------- */
.ctl{display:flex;flex-direction:column;gap:9px}
.ctl+.ctl{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ctlHead{display:flex;align-items:center;gap:8px}
.ctlHead svg{color:var(--sub);flex:0 0 auto}
.ctlLabel{font-size:13px;font-weight:600;color:#2b3448}
.ctlVal{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.ctlVal b{font-size:15px;font-weight:650;color:var(--ink);margin-right:1px}
.ctlVal.muted b{color:var(--faint);text-decoration:line-through}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;
  --p:50%;
}
input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:999px;
  background:linear-gradient(90deg,var(--accent) 0 var(--p),#e3e8f2 var(--p) 100%);
  transition:background .12s linear;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;margin-top:-5px;border-radius:50%;
  background:#fff;border:2.5px solid var(--accent);
  box-shadow:0 2px 6px rgba(47,91,224,.28);
  transition:transform .13s ease,box-shadow .13s ease;
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2);box-shadow:0 0 0 6px rgba(59,109,246,.14)}
input[type=range]:disabled{opacity:.45;cursor:default}

/* ---------------- 开关 ---------------- */
.card.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.switch{
  flex:0 0 auto;position:relative;width:44px;height:25px;border-radius:999px;
  border:1px solid rgba(16,24,40,.06);background:#d9dee9;cursor:pointer;
  transition:background .2s ease,box-shadow .2s ease;padding:0;
}
.switch>span{
  position:absolute;top:2.5px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.28);
  transition:transform .22s cubic-bezier(.3,.9,.35,1.2);
}
.switch[aria-checked=true]{background:linear-gradient(180deg,#4d7bff,#3b6df6);
  box-shadow:0 2px 8px -2px rgba(59,109,246,.6)}
.switch[aria-checked=true]>span{transform:translateX(19px)}

/* ---------------- 底部 ---------------- */
.foot{display:flex;gap:8px;margin-top:1px}
.btn{
  flex:1;height:36px;border-radius:10px;cursor:pointer;font:inherit;
  font-size:12.5px;font-weight:600;color:#37415a;
  background:rgba(255,255,255,.92);border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,24,40,.04);
  transition:.16s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{transform:translateY(-1px);background:#fff;border-color:rgba(16,24,40,.14);
  box-shadow:0 6px 14px -8px rgba(16,24,40,.5)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(180deg,#4d7bff,#3466f5);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px -5px rgba(52,102,245,.75)}
.btn.primary:hover{box-shadow:0 8px 18px -8px rgba(52,102,245,.9)}
.btn.quit:hover{color:var(--danger);border-color:rgba(224,72,77,.32);background:#fff8f8}
.foot svg{opacity:.75}

/* ---------------- toast ---------------- */
#toast{
  position:fixed;left:50%;bottom:18px;transform:translate(-50%,14px);
  padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;color:#fff;
  background:rgba(20,27,42,.9);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:.24s cubic-bezier(.2,.8,.3,1);z-index:9;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <section class="card hero">
    <span class="dot" id="dot"></span>
    <div class="heroText">
      <div class="heroTitle">服务运行中<span class="tag" id="uptime">刚刚启动</span></div>
      <div class="heroSub" id="sub">正在读取…</div>
    </div>
  </section>

  <section class="card">
    <div class="cardHead">
      <span class="cardTitle">手机连接</span>
      <button class="mini" id="copyAll">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A3.5 3.5 0 0 0 3 6.5v6A2.5 2.5 0 0 0 5.5 15"/></svg>
        复制
      </button>
    </div>
    <div class="field">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a9.5 9.5 0 0 1 14 0"/><path d="M8.2 15.7a5.6 5.6 0 0 1 7.6 0"/><circle cx="12" cy="19" r="1.3" fill="currentColor" stroke="none"/></svg>
      <span class="mono" id="addr">—</span>
    </div>
    <div class="pinBlock">
      <div class="pinLabel">配对码</div>
      <div class="pin" id="pin">······</div>
    </div>
    <div class="hint">手机和电脑连同一个网络，在 App 里填上面的地址与配对码。</div>
  </section>

  <section class="card">
    <div class="ctl">
      <div class="ctlHead">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/><path d="M16 9a4.2 4.2 0 0 1 0 6"/><path d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
        <span class="ctlLabel">音量</span>
        <span class="ctlVal" id="volVal"><b>—</b>%</span>
        <button class="mini ic" id="mute" title="静音">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/><path d="M16.5 9.5l4.5 5M21 9.5l-4.5 5"/></svg>
        </button>
      </div>
      <input type="range" id="vol" min="0" max="100" value="0" step="1">
    </div>
    <div class="ctl">
      <div class="ctlHead">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>
        <span class="ctlLabel">亮度</span>
        <span class="ctlVal" id="briVal"><b>—</b>%</span>
        <span class="tag" id="briMode" hidden></span>
      </div>
      <input type="range" id="bri" min="0" max="100" value="0" step="1">
    </div>
  </section>

  <section class="card row">
    <div>
      <div class="cardTitle" style="color:var(--ink);font-size:13.5px">开机自启</div>
      <div class="hint" id="autoHint">登录 Windows 后自动启动面板</div>
    </div>
    <button class="switch" id="auto" role="switch" aria-checked="false"><span></span></button>
  </section>

  <footer class="foot">
    <button class="btn primary" id="web">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8M12 3.6c4.4 4.6 4.4 12.2 0 16.8-4.4-4.6-4.4-12.2 0-16.8z"/></svg>
      网页版
    </button>
    <button class="btn" id="log">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h6.5L19 9v11.5H7z"/><path d="M13.2 3.8V9H19M10 13h5M10 16.5h5"/></svg>
      日志
    </button>
    <button class="btn quit" id="quit">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3.8v7.4"/><path d="M6.2 6.6a8 8 0 1 0 11.6 0"/></svg>
      退出
    </button>
  </footer>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const isPanel = !!window.chrome && !!navigator.userAgent.includes('Edg');
const PIN_KEY = 'pccontrol.pin';
let pin = localStorage.getItem(PIN_KEY) || '';
let busy = false;

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

async function api(path, body){
  const opt = { method: body ? 'POST' : 'GET', headers: {} };
  if (pin) opt.headers['X-Pin'] = pin;
  if (body) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(path, opt);
  if (r.status === 401) throw new Error('PIN');
  return r.json();
}

function paint(range){
  const p = ((range.value - range.min) / (range.max - range.min)) * 100;
  range.style.setProperty('--p', p + '%');
}

function humanUptime(s){
  if (s < 60) return '刚刚启动';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时';
  return Math.floor(s / 86400) + ' 天';
}

let firstLoad = true;
async function refresh(){
  if (busy) return;
  try {
    const s = await api('/api/status');
    if (!s.ok) return;
    pin = s.pin || pin;
    $('addr').textContent = s.ip + ':' + s.port;
    $('pin').textContent = s.pin || '——';
    $('uptime').textContent = humanUptime(s.uptime || 0);
    let sub = `${s.name} · 端口 ${s.port}`;
    if (s.lastClientIp) sub += ` · ${s.lastClientIp} 在 ${humanUptime(s.lastClientAgo || 0)}前连接`;
    else sub += ' · 暂无设备连接';
    $('sub').textContent = sub;

    if (s.volume !== null && s.volume !== undefined && !$('vol').matches(':active')) {
      $('vol').value = s.volume; paint($('vol'));
      $('volVal').innerHTML = '<b>' + s.volume + '</b>%';
      $('volVal').classList.toggle('muted', !!s.muted);
      $('mute').style.color = s.muted ? 'var(--danger)' : '';
    }
    $('vol').disabled = !s.canVolume;
    if (s.brightness !== null && s.brightness !== undefined && !$('bri').matches(':active')) {
      $('bri').value = s.brightness; paint($('bri'));
      $('briVal').innerHTML = '<b>' + s.brightness + '</b>%';
    }
    $('bri').disabled = !s.canBrightness;
    const mode = $('briMode');
    mode.hidden = !s.canBrightness;
    mode.textContent = s.brightnessMode === 'ddc' ? 'DDC/CI' : (s.brightnessMode === 'hdr-blocked' ? 'HDR 已锁' : '软件调光');
    mode.style.color = s.brightnessMode === 'ddc' ? 'var(--ok)' : 'var(--faint)';
    mode.style.background = s.brightnessMode === 'ddc' ? 'rgba(16,185,129,.12)' : 'rgba(150,160,180,.14)';

    $('auto').setAttribute('aria-checked', String(!!s.autostart));
    $('autoHint').textContent = s.autostart ? '登录 Windows 后自动启动面板' : '已关闭，重启后需手动启动';

    if (firstLoad) { firstLoad = false; if (!s.canVolume) $('mute').title = '音量控制不可用'; }
  } catch (e) {
    if (e.message === 'PIN') { /* 本机不应发生 */ }
  }
}

function debounce(fn, ms){
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

const pushVolume = debounce(async v => { busy = true; try { await api('/api/volume', { value: v }); } finally { busy = false; } }, 110);
const pushBrightness = debounce(async v => { busy = true; try { await api('/api/brightness', { value: v }); } finally { busy = false; } }, 110);

$('vol').addEventListener('input', e => {
  const v = +e.target.value;
  paint(e.target); $('volVal').innerHTML = '<b>' + v + '</b>%';
  pushVolume(v);
});
$('bri').addEventListener('input', e => {
  const v = +e.target.value;
  paint(e.target); $('briVal').innerHTML = '<b>' + v + '</b>%';
  pushBrightness(v);
});

$('mute').addEventListener('click', async () => {
  const r = await api('/api/mute', {});
  if (r.ok) { toast(r.muted ? '已静音' : '已取消静音'); refresh(); }
});

$('auto').addEventListener('click', async () => {
  const want = $('auto').getAttribute('aria-checked') !== 'true';
  const r = await api('/api/autostart', { value: want });
  $('auto').setAttribute('aria-checked', String(!!r.autostart));
  toast(r.autostart ? '已开启开机自启' : '已关闭开机自启');
  refresh();
});

$('copyAll').addEventListener('click', async () => {
  const text = `地址 ${$('addr').textContent}　配对码 ${$('pin').textContent}`;
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制连接信息');
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制连接信息');
  }
});

$('web').addEventListener('click', () => act('web'));
$('log').addEventListener('click', () => act('log'));
$('quit').addEventListener('click', () => {
  if (confirm('退出后手机将无法控制这台电脑。\n（也可以只关闭这个窗口，让服务继续在后台运行）')) act('quit');
});

async function act(name){
  try {
    const r = await api('/api/panel', { action: name });
    if (r && r.ok === false) toast(r.error || '操作失败');
    if (name === 'quit' && r.ok) toast('服务已停止');
  } catch (_) { toast('当前环境不支持该操作'); }
}


paint($('vol')); paint($('bri'));
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
